services:
  postgres:
    image: postgres:16-alpine
    container_name: ahk-sample-tracking-postgres
    environment:
      POSTGRES_DB: ahk_samples
      POSTGRES_USER: ahk
      POSTGRES_PASSWORD: ahk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahk -d ahk_samples"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
