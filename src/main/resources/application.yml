spring:
  application:
    name: industrial-data-orchestrator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ahk_samples}
    username: ${DB_USERNAME:ahk}
    password: ${DB_PASSWORD:ahk}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
